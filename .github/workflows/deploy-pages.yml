name: Publish production and beta

# Deploy only from the default branch. Beta pushes send a lightweight signal
# so Pages works even when the github-pages environment allows only main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Beta deployment signal"]
    types: [completed]
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          persist-credentials: false

      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src
          persist-credentials: false

      - name: Assemble and validate independent sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/beta
          rsync -a --exclude='.git' --exclude='.github' main-src/ public/
          rsync -a --exclude='.git' --exclude='.github' beta-src/ public/beta/
          touch public/.nojekyll
          test -s public/index.html
          test -s public/beta/index.html
          test -s public/version.json
          test -s public/beta/version.json
          grep -q 'data-censo-channel="beta"' public/beta/index.html
          echo "Production: $(cat public/version.json)"
          echo "Beta: $(cat public/beta/version.json)"
          if cmp -s public/index.html public/beta/index.html; then
            echo "::error::Beta and main index.html are unexpectedly identical."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
